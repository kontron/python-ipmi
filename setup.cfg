[aliases]
test=pytest

[nosetests]
with-coverage = 1
cover-xml = 1
cover-branches = 1
cover-package = pyipmi

[pep257]
ignore = D100,D101,D102,D103,D104,D105,D203,D204

[codespell]
skip = ./.git,*.bin,*.pyc,./tests/fru_bin,./tests/hpm_bin,./man/ipmitool.py.1
ignore-words-list = pres

[mypy]
files = pyipmi

# optional dependencies, they are not installed for the type check, and
# the version module, which is generated by setup.py
[mypy-serial.*,pyaardvark.*,cryptography.*,pyipmi.version]
ignore_missing_imports = True

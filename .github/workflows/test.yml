name: Test

on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install python-coveralls coverage pytest pytest-cov

      # cryptography (needed for RMCP+ AES) cannot be built for PyPy 3.10,
      # the AES tests are skipped there
      - name: Install optional dependencies
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        run: pip install cryptography

        #      - name: Setup and run tests
        #        run: python setup.py test

      - name: Test with pytest
        run: |
          pytest --cov=pyipmi --cov-report=lcov

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: run-${{ matrix.python-version }}
          parallel: true
          path-to-lcov: coverage.lcov

  finish:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true

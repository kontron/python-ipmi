name: Lint

on: [push, pull_request, workflow_dispatch]

jobs:
  ruff:
    name: Lint with ruff
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff==0.16.10

      - name: Lint with ruff
        run: ruff check --output-format=github .

  mypy:
    name: Type check with mypy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mypy==2.4.0

      # the files and options are configured in setup.cfg
      - name: Type check with mypy
        run: mypy

  docs:
    name: Build the documentation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get install -y graphviz
          pip install -r docs/requirements.txt

      # warnings are errors, like on Read the Docs
      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

  codespell:
    name: Check spelling with codespell
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install codespell

      - name: Check spelling
        run: codespell

  manpage:
    name: Check man page is up to date
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install argparse-manpage==4.7

      - name: Generate man page
        run: bin/build_manpage.sh

      # the date in the .TH header changes with every build
      - name: Check for changes
        run: git diff --exit-code -I '^\.TH ' man/pyipmi.1
